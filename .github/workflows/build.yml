name: Build and native smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voxel-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate schema family
        run: |
          python -m pip install -r scripts/requirements-validation.txt
          python scripts/verify_schemas.py
      - name: Regenerate independent upstream source vectors
        run: |
          mkdir -p build/algorithm-reference
          g++ -std=c++20 -O2 -fwrapv -fno-fast-math -ffp-contract=off reference/fastnoiselite/reference.cpp -o build/algorithm-reference/reference
          build/algorithm-reference/reference > build/algorithm-reference/cpp-vectors.tsv
          cmp fixtures/algorithm-cpp-vectors.tsv build/algorithm-reference/cpp-vectors.tsv
      - name: Clean build and contracts
        run: ./gradlew clean test build dependencyNotices releaseJars
      - name: Independent engine consumer
        run: |
          mkdir -p build/independent
          javac -cp build/release/jars/noise-generator-engine.jar -d build/independent example-client/src/main/java/io/voxelcreator/example/*.java
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.Example build/independent/output
          python scripts/verify_profile_capture.py build/independent/output/profile-capture.json build/independent/output/profile-capture.csv
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.WorldWorkConsumer fixtures/work-profile-project.json build/independent/output
          python scripts/verify_world_work.py build/independent/output
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.SemanticSharingConsumer fixtures/semantic-sharing.json build/independent/output
          python scripts/verify_semantic_sharing.py build/independent/output
          java -cp build/independent:build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.example.Example --contracts build/field-operations/contracts
          python scripts/sync_field_contracts.py build/field-operations/contracts
      - name: Independent import transaction reference
        run: java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ImportSessionConsumer
      - name: Exact storage measurements
        shell: bash
        run: java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.StorageBenchmark > build/storage-benchmark.csv
      - name: Exact voxel and artifact hashes
        run: |
          java -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.render.Benchmark > build/benchmark.csv
          python scripts/verify_artifacts.py --benchmark build/benchmark.csv --hashes build/jar-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-jar-hashes
          path: build/jar-hashes.txt
      - name: Native editor smoke
        run: |
          bash scripts/prepare_native_linux.sh
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -Dvoxel.configDir="$PWD/build/smoke" -jar build/release/jars/ProceduralVoxelCreator.jar --smoke
      - name: Ready editor startup and failure ownership
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.StartupProbe build/startup
          python scripts/verify_startup.py build/startup
      - name: Native volume numerical reference
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.VolumeRenderProbe
      - name: Packed streaming renderer reference
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.StreamingRenderProbe
      - name: Application creation profile reference
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CreationProfileProbe build/creation-profile
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CreationDefaultsConsumer build/creation-profile/created-project.pvproj.json
          python scripts/verify_app_metadata.py build/creation-profile/app-config.json
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ApplicationProfileInputsProbe build/creation-profile/raw-inputs
          python scripts/verify_creation_inputs.py build/creation-profile/raw-inputs
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.SettingsLayoutProbe build/settings-layout
          python scripts/verify_settings_layout.py build/settings-layout
      - name: Theme preview and contrast reference
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ThemeReferenceProbe build/theme-probe
          python scripts/verify_theme.py build/theme-probe/user-config.json build/theme-probe/theme-contrast.json
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ThemeWorkspaceProbe build/theme-workspace
          python scripts/verify_theme_workspace.py build/theme-workspace
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ThemeLayoutProbe build/theme-layout
          python scripts/verify_theme_layout.py build/theme-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.UpdateTrustProbe build/update-trust
          python scripts/verify_update_trust.py build/update-trust
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.UpdateCheckProbe build/update-check
          python scripts/verify_update_check.py build/update-check
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.WorkspaceProbe build/workspace
          python scripts/verify_workspace.py build/workspace
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PerformancePreferencesProbe build/performance-preferences
          python scripts/verify_performance_preferences.py build/performance-preferences
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PreferencesLayoutProbe build/preferences-layout
          python scripts/verify_preferences_layout.py build/preferences-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.GeneralSettingsLayoutProbe build/general-settings-layout
          python scripts/verify_general_settings_layout.py build/general-settings-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ProfileLayoutProbe build/profile-layout
          python scripts/verify_profile_layout.py build/profile-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.DiagnosticsLayoutProbe build/diagnostics-layout
          python scripts/verify_diagnostics_layout.py build/diagnostics-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.FindTraceLayoutProbe build/find-trace-layout
          python scripts/verify_find_trace_layout.py build/find-trace-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.InspectorLayoutProbe build/inspector-layout
          python scripts/verify_inspector_layout.py build/inspector-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.HelpAboutProbe build/help-about
          python scripts/verify_help_about.py build/help-about
          python scripts/verify_profile_capture.py build/profile-layout/reviewed.json build/profile-layout/reviewed.csv
          xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.WindowPlacementProbe build/window-placement
          python scripts/verify_window_placement.py build/window-placement
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.UiScaleProbe build/ui-scales
          python scripts/verify_ui_scales.py build/ui-scales
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.UiScaleLayoutProbe build/ui-scale-layout
          python scripts/verify_ui_scale_layout.py build/ui-scale-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.DialogLayoutProbe build/dialog-layout
          python scripts/verify_dialog_layout.py build/dialog-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PopupLayoutProbe build/popup-layout
          python scripts/verify_popup_layout.py build/popup-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.DraftPopupLayoutProbe build/draft-popup-layout
          python scripts/verify_draft_popup_layout.py build/draft-popup-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CurveLayoutProbe build/curve-layout
          python scripts/verify_curve_layout.py build/curve-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.StatusBarProbe build/status-bar
          python scripts/verify_status_bar.py build/status-bar
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CoreWindowLayoutProbe build/core-window-layout
          python scripts/verify_core_window_layout.py build/core-window-layout
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PopupMonitorProbe build/popup-monitor
          python scripts/verify_popup_monitor.py build/popup-monitor
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.UiDpiProbe build/ui-dpi
          python scripts/verify_ui_dpi.py build/ui-dpi
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.TooltipProbe build/tooltips
          python scripts/verify_tooltips.py build/tooltips
      - name: Large resource browser reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ResourceBrowserProbe build/browser-probe
          python scripts/verify_resource_browser.py build/browser-probe/resource-browser.json
      - name: Resource picker membership and export reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ResourceWorkflowProbe build/workflow-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ResourceSelectionConsumer build/workflow-probe/selection.pvresources.json
          python scripts/verify_resource_workflows.py build/workflow-probe/resource-workflows.json build/workflow-probe/selection.pvresources.json
      - name: Unified Find and protected navigation reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.UnifiedFindProbe build/find-probe
          python scripts/verify_unified_find.py build/find-probe/unified-find.json
      - name: Resource hierarchy and execution isolation reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.HierarchyReferenceProbe build/hierarchy-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.HierarchyConsumer build/hierarchy-probe/organized-project.json
          python scripts/verify_hierarchy.py build/hierarchy-probe/organized-project.json build/hierarchy-probe/hierarchy-reference.json
      - name: Bookmark native workflow and independent consumer
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.BookmarkReferenceProbe build/bookmark-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.BookmarkConsumer build/bookmark-probe/bookmarks-project.json
          python scripts/verify_bookmarks.py build/bookmark-probe/bookmarks-project.json build/bookmark-probe/bookmarks-reference.json
      - name: Typed noise authoring and dependency resolution reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.NoiseAuthoringProbe build/noise-authoring-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.NoiseAuthoringConsumer build/noise-authoring-probe/noise-authoring-project.json
          python scripts/verify_noise_authoring.py build/noise-authoring-probe/noise-authoring-project.json build/noise-authoring-probe/noise-authoring-reference.json
      - name: Sampled calculus and distance-shape workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.FieldOperationsProbe build/field-operations
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.FieldOperationsConsumer build/field-operations/field-operations-project.json 37.5 build/field-operations
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.FieldOperationsConsumer fixtures/field-operations.json 57
          python scripts/verify_field_operations.py build/field-operations
      - name: Trace explanations and guarded native navigation
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.TraceWorkflowProbe build/trace-workflow
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.TraceConsumer build/trace-workflow/trace-project.json
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.TraceConsumer fixtures/trace-workflow.json
          python scripts/verify_trace_workflow.py build/trace-workflow
      - name: Source algorithm controls and independent references
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.SourceAlgorithmProbe build/algorithm-reference
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.AlgorithmReferenceConsumer fixtures/algorithm-cpp-vectors.tsv fixtures/algorithm-analytic-vectors.json build/algorithm-reference build/algorithm-reference/source-algorithm-project.json
          python scripts/verify_algorithm_references.py build/algorithm-reference
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-algorithm-bits
          path: build/algorithm-reference/algorithm-jvm-bits.json
      - name: Scalar remapping and weighted combination workflow
        run: |
          python scripts/generate_remapping_vectors.py build/remapping-reference-vectors.json
          cmp fixtures/remapping-vectors.json build/remapping-reference-vectors.json
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ScalarRemappingProbe build/scalar-remapping
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ScalarRemappingConsumer build/scalar-remapping/remapping-project.json 3.25 fixtures/remapping-vectors.json build/scalar-remapping
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ScalarRemappingConsumer fixtures/scalar-remapping.json .5 fixtures/remapping-vectors.json
          python scripts/verify_scalar_remapping.py build/scalar-remapping
      - name: Shared warp controls and sampled displacements
        run: |
          python scripts/generate_warp_vectors.py build/warp-reference-vectors.json
          cmp fixtures/warp-vectors.json build/warp-reference-vectors.json
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.WarpControlsProbe build/warp-controls
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.WarpConsumer build/warp-controls/warp-project.json 198 fixtures/warp-vectors.json build/warp-controls
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.WarpConsumer fixtures/warp-fields.json 55 fixtures/warp-vectors.json
          python scripts/verify_warp_controls.py build/warp-controls
      - name: Phased placement driver workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PlacementDriverProbe build/placement-drivers
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.PlacementDriverConsumer build/placement-drivers/placement-driver-project.json 4 build/placement-drivers
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.PlacementDriverConsumer fixtures/placement-driver-phases.json 2
          python scripts/verify_placement_driver_phases.py build/placement-drivers
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.TransformDriverConsumer fixtures/transform-drivers.json build/placement-drivers
          python scripts/verify_transform_drivers.py build/placement-drivers
      - name: Expression diagnostic recovery workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ExpressionRecoveryProbe build/expression-recovery
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ExpressionRecoveryConsumer build/expression-recovery/expression-recovery-project.json
      - name: Expanded expression private editing workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ExpandedExpressionProbe build/expanded-expression
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ExpressionRecoveryConsumer build/expanded-expression/expanded-expression-project.json 6
          python scripts/verify_expression_selection.py build/expression-recovery build/expanded-expression
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ExpressionLayoutProbe build/expression-layout
          python scripts/verify_expression_layout.py build/expression-layout
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ExpressionRecoveryConsumer build/expression-layout/expression-layout-project.json 2
      - name: Bookmark and teleport raw coordinate workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.BookmarkInputProbe build/bookmark-inputs
          python scripts/verify_bookmark_inputs.py build/bookmark-inputs
      - name: Owned import workspace and native resolution workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ImportWorkspaceProbe build/import-workspace
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ImportWorkspaceConsumer build/import-workspace
          python scripts/verify_import_workspace.py build/import-workspace
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ResourceReviewLayoutProbe build/resource-review-layout
          python scripts/verify_resource_review_layout.py build/resource-review-layout
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PackageLayoutProbe build/package-layout
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ResourceSelectionConsumer build/package-layout/selection.pvresources.json
          python scripts/verify_package_layout.py build/package-layout
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ExportHierarchyProbe build/export-hierarchy
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ExportHierarchyConsumer build/export-hierarchy/hierarchy.pvresources.json
          python scripts/verify_export_hierarchy.py build/export-hierarchy
      - name: Project history and unapplied Properties workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ProjectHistoryProbe build/project-history
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ProjectHistoryConsumer build/project-history
          python scripts/verify_project_history.py build/project-history
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ProjectDecisionLayoutProbe build/project-decision-layout
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ProjectDialogConsumer build/project-decision-layout
          python scripts/verify_project_decision_layout.py build/project-decision-layout
      - name: Project transitions and unapplied Properties workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ProjectDraftTransitionProbe build/project-drafts
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ProjectDraftConsumer build/project-drafts
          python scripts/verify_project_drafts.py build/project-drafts
      - name: Guarded browser mutations and atomic Properties workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ResourceEditProbe build/browser-edits
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.BrowserEditConsumer build/browser-edits/resource-edit-project.json
          python scripts/verify_browser_edits.py build/browser-edits
      - name: Browser selection and protected Properties workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ResourceSelectionProbe build/browser-selection
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.BrowserSelectionConsumer build/browser-selection/resource-selection-project.json
          python scripts/verify_browser_selection.py build/browser-selection
      - name: Properties seed text and guarded Apply workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.SeedTextProbe build/seed-text
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.SeedTextConsumer build/seed-text/seed-text-project.json build/seed-text
          python scripts/verify_seed_text.py build/seed-text
      - name: Pinned controls identity and group workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PinWorkflowProbe build/pin-browser
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.PinBrowserConsumer build/pin-browser/pin-browser-project.json
          python scripts/verify_pin_browser.py build/pin-browser
      - name: Project Settings transaction and diagnostic focus workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ProjectSettingsProbe build/project-settings
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ProjectSettingsConsumer build/project-settings/project-settings-project.json
          python scripts/verify_project_settings.py build/project-settings
      - name: World setting diagnostic control focus workflow
        run: |
