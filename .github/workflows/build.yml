  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate schema family
        run: |
          python -m pip install -r scripts/requirements-validation.txt
          python scripts/verify_schemas.py
      - name: Build and test
        run: .\gradlew.bat clean test build dependencyNotices releaseJars
      - name: Independent engine consumer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/independent | Out-Null
          javac -cp build/release/jars/noise-generator-engine.jar -d build/independent (Get-ChildItem example-client/src/main/java/io/voxelcreator/example/*.java).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.Example build/independent/output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_profile_capture.py build/independent/output/profile-capture.json build/independent/output/profile-capture.csv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.WorldWorkConsumer fixtures/work-profile-project.json build/independent/output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_world_work.py build/independent/output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.SemanticSharingConsumer fixtures/semantic-sharing.json build/independent/output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_semantic_sharing.py build/independent/output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'build/independent;build/release/jars/ProceduralVoxelCreator.jar' io.voxelcreator.example.Example --contracts build/field-operations/contracts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/sync_field_contracts.py build/field-operations/contracts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact storage measurements
        shell: pwsh
        run: |
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.StorageBenchmark | Out-File -Encoding utf8 build/storage-benchmark.csv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact voxel and artifact hashes
        shell: pwsh
        run: |
          java -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.render.Benchmark | Out-File -Encoding utf8 build/benchmark.csv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_artifacts.py --benchmark build/benchmark.csv --hashes build/jar-hashes.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-jar-hashes
          path: build/jar-hashes.txt
      - name: Assemble runtime and software OpenGL
        shell: pwsh
        run: |
          jlink --add-modules java.base,java.desktop,java.net.http,java.management,java.logging,jdk.unsupported --strip-debug --no-header-files --no-man-pages --output build/windows-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = "$env:RUNNER_TEMP/mesa.7z"
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa checksum mismatch' }
          7z x $archive "-o$env:RUNNER_TEMP/mesa" -y | Out-Null
          $driver = Get-ChildItem "$env:RUNNER_TEMP/mesa" -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $driver) { throw 'Missing Mesa x64 OpenGL driver' }
          Copy-Item "$($driver.DirectoryName)/*.dll" build/windows-runtime/bin/ -Force
          New-Item -ItemType Directory -Force build/mesa-notices | Out-Null
          $mesaRoot = "$env:RUNNER_TEMP/mesa"
          Get-ChildItem $mesaRoot -Recurse -File | Where-Object { $_.FullName -match 'license|copying|readme' } | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($mesaRoot, $_.FullName)
            $destination = Join-Path "$PWD/build/mesa-notices" $relative
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $_.FullName $destination -Force
          }
          "Mesa 26.2.4 release-msvc archive SHA256 $expected" | Out-File build/mesa-notices/INPUT.txt
      - name: Bundled Windows desktop smoke
        shell: pwsh
        run: |
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:LIBGL_ALWAYS_SOFTWARE = 'true'
          & build/windows-runtime/bin/java.exe --enable-native-access=ALL-UNNAMED "-Dvoxel.configDir=$PWD/build/smoke" -jar build/release/jars/ProceduralVoxelCreator.jar --smoke 2>&1 | Tee-Object build/windows-smoke.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Select-String -Path build/windows-smoke.log -Pattern 'THREE_ENGINE_VIEWPORTS_PASS')) { throw 'Viewport smoke did not complete' }
      - name: Windows ready editor startup and failure ownership
        shell: pwsh
