name: Build and native smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voxel-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate schema family
        run: |
          python -m pip install -r scripts/requirements-validation.txt
          python scripts/verify_schemas.py
      - name: Regenerate independent upstream source vectors
        run: |
          mkdir -p build/algorithm-reference
          g++ -std=c++20 -O2 -fwrapv -fno-fast-math -ffp-contract=off reference/fastnoiselite/reference.cpp -o build/algorithm-reference/reference
          build/algorithm-reference/reference > build/algorithm-reference/cpp-vectors.tsv
          cmp fixtures/algorithm-cpp-vectors.tsv build/algorithm-reference/cpp-vectors.tsv
      - name: Clean build and contracts
        run: ./gradlew clean test build dependencyNotices releaseJars
      - name: Independent engine consumer
        run: |
          mkdir -p build/independent
          javac -cp build/release/jars/noise-generator-engine.jar -d build/independent example-client/src/main/java/io/voxelcreator/example/*.java
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.Example build/independent/output
          python scripts/verify_profile_capture.py build/independent/output/profile-capture.json build/independent/output/profile-capture.csv
          java -cp build/independent:build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.example.Example --contracts build/field-operations/contracts
          python scripts/sync_field_contracts.py build/field-operations/contracts
      - name: Independent import transaction reference
        run: java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ImportSessionConsumer
      - name: Exact storage measurements
        shell: bash
        run: java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.StorageBenchmark > build/storage-benchmark.csv
      - name: Exact voxel and artifact hashes
        run: |
          java -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.render.Benchmark > build/benchmark.csv
          python scripts/verify_artifacts.py --benchmark build/benchmark.csv --hashes build/jar-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-jar-hashes
          path: build/jar-hashes.txt
      - name: Native editor smoke
        run: |
          bash scripts/prepare_native_linux.sh
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -Dvoxel.configDir="$PWD/build/smoke" -jar build/release/jars/ProceduralVoxelCreator.jar --smoke
      - name: Native volume numerical reference
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.VolumeRenderProbe
      - name: Packed streaming renderer reference
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.StreamingRenderProbe
      - name: Application creation profile reference
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CreationProfileProbe build/creation-profile
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CreationDefaultsConsumer build/creation-profile/created-project.pvproj.json
          python scripts/verify_app_metadata.py build/creation-profile/app-config.json
      - name: Theme preview and contrast reference
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ThemeReferenceProbe build/theme-probe
          python scripts/verify_theme.py build/theme-probe/user-config.json build/theme-probe/theme-contrast.json
      - name: Large resource browser reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ResourceBrowserProbe build/browser-probe
          python scripts/verify_resource_browser.py build/browser-probe/resource-browser.json
      - name: Resource picker membership and export reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ResourceWorkflowProbe build/workflow-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ResourceSelectionConsumer build/workflow-probe/selection.pvresources.json
          python scripts/verify_resource_workflows.py build/workflow-probe/resource-workflows.json build/workflow-probe/selection.pvresources.json
      - name: Unified Find and protected navigation reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.UnifiedFindProbe build/find-probe
          python scripts/verify_unified_find.py build/find-probe/unified-find.json
      - name: Resource hierarchy and execution isolation reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.HierarchyReferenceProbe build/hierarchy-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.HierarchyConsumer build/hierarchy-probe/organized-project.json
          python scripts/verify_hierarchy.py build/hierarchy-probe/organized-project.json build/hierarchy-probe/hierarchy-reference.json
      - name: Bookmark native workflow and independent consumer
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.BookmarkReferenceProbe build/bookmark-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.BookmarkConsumer build/bookmark-probe/bookmarks-project.json
          python scripts/verify_bookmarks.py build/bookmark-probe/bookmarks-project.json build/bookmark-probe/bookmarks-reference.json
      - name: Typed noise authoring and dependency resolution reference
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.NoiseAuthoringProbe build/noise-authoring-probe
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.NoiseAuthoringConsumer build/noise-authoring-probe/noise-authoring-project.json
          python scripts/verify_noise_authoring.py build/noise-authoring-probe/noise-authoring-project.json build/noise-authoring-probe/noise-authoring-reference.json
      - name: Sampled calculus and distance-shape workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.FieldOperationsProbe build/field-operations
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.FieldOperationsConsumer build/field-operations/field-operations-project.json 37.5 build/field-operations
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.FieldOperationsConsumer fixtures/field-operations.json 57
          python scripts/verify_field_operations.py build/field-operations
      - name: Trace explanations and guarded native navigation
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.TraceWorkflowProbe build/trace-workflow
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.TraceConsumer build/trace-workflow/trace-project.json
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.TraceConsumer fixtures/trace-workflow.json
          python scripts/verify_trace_workflow.py build/trace-workflow
      - name: Source algorithm controls and independent references
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.SourceAlgorithmProbe build/algorithm-reference
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.AlgorithmReferenceConsumer fixtures/algorithm-cpp-vectors.tsv fixtures/algorithm-analytic-vectors.json build/algorithm-reference build/algorithm-reference/source-algorithm-project.json
          python scripts/verify_algorithm_references.py build/algorithm-reference
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-algorithm-bits
          path: build/algorithm-reference/algorithm-jvm-bits.json
      - name: Scalar remapping and weighted combination workflow
        run: |
          python scripts/generate_remapping_vectors.py build/remapping-reference-vectors.json
          cmp fixtures/remapping-vectors.json build/remapping-reference-vectors.json
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ScalarRemappingProbe build/scalar-remapping
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ScalarRemappingConsumer build/scalar-remapping/remapping-project.json 3.25 fixtures/remapping-vectors.json build/scalar-remapping
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ScalarRemappingConsumer fixtures/scalar-remapping.json .5 fixtures/remapping-vectors.json
          python scripts/verify_scalar_remapping.py build/scalar-remapping
      - name: Shared warp controls and sampled displacements
        run: |
          python scripts/generate_warp_vectors.py build/warp-reference-vectors.json
          cmp fixtures/warp-vectors.json build/warp-reference-vectors.json
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.WarpControlsProbe build/warp-controls
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.WarpConsumer build/warp-controls/warp-project.json 198 fixtures/warp-vectors.json build/warp-controls
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.WarpConsumer fixtures/warp-fields.json 55 fixtures/warp-vectors.json
          python scripts/verify_warp_controls.py build/warp-controls
      - name: Phased placement driver workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PlacementDriverProbe build/placement-drivers
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.PlacementDriverConsumer build/placement-drivers/placement-driver-project.json 4 build/placement-drivers
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.PlacementDriverConsumer fixtures/placement-driver-phases.json 2
          python scripts/verify_placement_driver_phases.py build/placement-drivers
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.TransformDriverConsumer fixtures/transform-drivers.json build/placement-drivers
          python scripts/verify_transform_drivers.py build/placement-drivers
      - name: Expression diagnostic recovery workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ExpressionRecoveryProbe build/expression-recovery
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ExpressionRecoveryConsumer build/expression-recovery/expression-recovery-project.json
      - name: Expanded expression private editing workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ExpandedExpressionProbe build/expanded-expression
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ExpressionRecoveryConsumer build/expanded-expression/expanded-expression-project.json 6
      - name: Curve pointer gesture and draft workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CurveGestureProbe build/curve-gesture
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CurveGestureConsumer build/curve-gesture/curve-gesture-project.json
      - name: Curve tangent and point editing workflow
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CurvePointProbe build/curve-point
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CurvePointConsumer build/curve-point/curve-point-project.json
      - name: Curve view navigation and authoring isolation
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CurveNavigationProbe build/curve-navigation
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CurveNavigationConsumer build/curve-navigation/curve-navigation-project.json
      - name: Curve numerical preview recovery
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CurvePreviewProbe build/curve-preview
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CurvePreviewConsumer build/curve-preview/curve-preview-project.json
      - name: Curve wrapping exact reference and native workflow
        run: |
          python scripts/curve_wrapping_reference.py fixtures/curve-wrapping-vectors.json --check
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CurveWrappingProbe build/curve-wrapping
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CurveWrappingConsumer fixtures/curve-wrapping-vectors.json build/curve-wrapping/curve-wrapping-project.json build/curve-wrapping
      - name: Curve mode domain and context controls
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CurveControlsProbe build/curve-controls
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.CurveControlsConsumer build/curve-controls/curve-controls-project.json
          python scripts/verify_curve_controls.py build/curve-controls
      - name: Exact 2D image row cache reference
        run: |
          java -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ImageRowsReference build/image-rows
          java -cp build/independent:build/release/jars/noise-generator-engine.jar io.voxelcreator.example.ImageRowsConsumer build/image-rows
          python scripts/verify_image_rows.py build/image-rows
      - name: Native 2D image input
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.NoiseImageInputProbe build/image-input
          python scripts/verify_image_input.py build/image-input
      - name: Native preview budget and queue recovery
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.PreviewAdmissionProbe build/preview-admission
          python scripts/verify_preview_admission.py build/preview-admission
      - name: Native World picking and stale-result guards
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.WorldPickingProbe build/world-picking
          python scripts/verify_world_picking.py build/world-picking
      - name: Native keyboard input and preference reference
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ShortcutInputProbe build/input-probe
          python scripts/verify_input_preferences.py build/input-probe/user-config.json
      - name: Strict OpenGL 3.0 arena reference
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.0 MESA_GLSL_VERSION_OVERRIDE=130 xvfb-run -a java --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.StreamingRenderProbe --require-gl30
          python scripts/verify_volume_overlap.py build/world-picking/volume-overlap-gl30
          python scripts/verify_surface_lod.py build/world-picking/surface-lod-gl30
          python scripts/verify_gpu_timing.py build/world-picking/gpu-timing-gl30
          python scripts/verify_shadows.py build/world-picking/shadows-gl30
          python scripts/verify_volume_light.py build/world-picking/volume-light-gl30
          python scripts/verify_volume_coarse.py build/world-picking/volume-coarse-gl30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-evidence
          path: |
            **/build/test-results/
            **/build/reports/tests/
            build/smoke/
            build/theme-probe/
            build/browser-probe/
            build/workflow-probe/
            build/find-probe/
            build/hierarchy-probe/
            build/bookmark-probe/
            build/noise-authoring-probe/
            build/field-operations/
            build/trace-workflow/
            build/algorithm-reference/
            build/scalar-remapping/
            build/warp-controls/
            build/placement-drivers/
            build/expression-recovery/
            build/expanded-expression/
            build/curve-gesture/
            build/curve-point/
            build/curve-navigation/
            build/curve-preview/
            build/curve-wrapping/
            build/curve-controls/
            build/image-rows/
            build/image-input/
            build/preview-admission/
            build/world-picking/
            build/benchmark.csv
            build/storage-benchmark.csv
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate schema family
        run: |
          python -m pip install -r scripts/requirements-validation.txt
          python scripts/verify_schemas.py
      - name: Build and test
        run: .\gradlew.bat clean test build dependencyNotices releaseJars
      - name: Independent engine consumer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/independent | Out-Null
          javac -cp build/release/jars/noise-generator-engine.jar -d build/independent (Get-ChildItem example-client/src/main/java/io/voxelcreator/example/*.java).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.Example build/independent/output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_profile_capture.py build/independent/output/profile-capture.json build/independent/output/profile-capture.csv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'build/independent;build/release/jars/ProceduralVoxelCreator.jar' io.voxelcreator.example.Example --contracts build/field-operations/contracts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/sync_field_contracts.py build/field-operations/contracts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact storage measurements
        shell: pwsh
        run: |
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.StorageBenchmark | Out-File -Encoding utf8 build/storage-benchmark.csv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact voxel and artifact hashes
        shell: pwsh
        run: |
          java -Xmx1g -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.render.Benchmark | Out-File -Encoding utf8 build/benchmark.csv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_artifacts.py --benchmark build/benchmark.csv --hashes build/jar-hashes.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-jar-hashes
          path: build/jar-hashes.txt
      - name: Assemble runtime and software OpenGL
        shell: pwsh
        run: |
          jlink --add-modules java.base,java.desktop,java.net.http,java.management,java.logging,jdk.unsupported --strip-debug --no-header-files --no-man-pages --output build/windows-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = "$env:RUNNER_TEMP/mesa.7z"
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa checksum mismatch' }
          7z x $archive "-o$env:RUNNER_TEMP/mesa" -y | Out-Null
          $driver = Get-ChildItem "$env:RUNNER_TEMP/mesa" -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $driver) { throw 'Missing Mesa x64 OpenGL driver' }
          Copy-Item "$($driver.DirectoryName)/*.dll" build/windows-runtime/bin/ -Force
          New-Item -ItemType Directory -Force build/mesa-notices | Out-Null
          $mesaRoot = "$env:RUNNER_TEMP/mesa"
          Get-ChildItem $mesaRoot -Recurse -File | Where-Object { $_.FullName -match 'license|copying|readme' } | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($mesaRoot, $_.FullName)
            $destination = Join-Path "$PWD/build/mesa-notices" $relative
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $_.FullName $destination -Force
          }
          "Mesa 26.2.4 release-msvc archive SHA256 $expected" | Out-File build/mesa-notices/INPUT.txt
      - name: Bundled Windows desktop smoke
        shell: pwsh
        run: |
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:LIBGL_ALWAYS_SOFTWARE = 'true'
          & build/windows-runtime/bin/java.exe --enable-native-access=ALL-UNNAMED "-Dvoxel.configDir=$PWD/build/smoke" -jar build/release/jars/ProceduralVoxelCreator.jar --smoke 2>&1 | Tee-Object build/windows-smoke.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Select-String -Path build/windows-smoke.log -Pattern 'THREE_ENGINE_VIEWPORTS_PASS')) { throw 'Viewport smoke did not complete' }
      - name: Windows independent import transaction reference
        shell: pwsh
        run: |
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.ImportSessionConsumer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows volume numerical reference
        shell: pwsh
        run: |
          & build/windows-runtime/bin/java.exe --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.VolumeRenderProbe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows packed streaming renderer reference
        shell: pwsh
        run: |
          & build/windows-runtime/bin/java.exe --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.StreamingRenderProbe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows application creation profile reference
        shell: pwsh
        run: |
          & build/windows-runtime/bin/java.exe --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.CreationProfileProbe build/creation-profile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp 'build/independent;build/release/jars/noise-generator-engine.jar' io.voxelcreator.example.CreationDefaultsConsumer build/creation-profile/created-project.pvproj.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_app_metadata.py build/creation-profile/app-config.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows theme preview and contrast reference
        shell: pwsh
        run: |
          & build/windows-runtime/bin/java.exe --enable-native-access=ALL-UNNAMED -cp build/release/jars/ProceduralVoxelCreator.jar io.voxelcreator.editor.ThemeReferenceProbe build/theme-probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
