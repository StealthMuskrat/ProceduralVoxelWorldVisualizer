  reproducibility:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-jar-hashes'
          path: hashes
      - name: Compare Linux and Windows JAR bytes
        run: cmp hashes/Linux-jar-hashes/jar-hashes.txt hashes/Windows-jar-hashes/jar-hashes.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-algorithm-bits'
          path: algorithm-bits
      - name: Compare Linux and Windows source-noise raw bits
        run: python -c "import json,pathlib; p=pathlib.Path('algorithm-bits'); a=json.loads((p/'Linux-algorithm-bits/algorithm-jvm-bits.json').read_text()); b=json.loads((p/'Windows-algorithm-bits/algorithm-jvm-bits.json').read_text()); assert len(a)==20 and a==b; print('All 20 source/dimension raw-bit digests match')"
